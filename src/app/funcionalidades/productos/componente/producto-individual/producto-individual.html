<div class="card" style="width: 18rem;">
  <div class="card-body">
    <h5 class="card-title"> {{ producto().categoria }} </h5>
    <h6 class="card-text">{{ producto().nombre }}</h6>
    <p>Precio: {{ producto().precio | number:'1.2-2' }}</p>
    <small>{{ producto().descripcion }}</small>
    <button>
        Editar
    </button>
    <button>
      Eliminar
    </button>
  </div>
</div>
